services:
  aira-gatse:
    image: aira-gatse:${IMAGE_TAG:-local}
    build:
      context: .
      target: runtime
      args:
        APP_REVISION: ${APP_REVISION:-development}
    environment:
      DISCORD_ENABLED: ${DISCORD_ENABLED:-false}
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      HEALTH_HOST: 0.0.0.0
      HEALTH_PORT: 3000
    ports:
      - "${HEALTH_BIND_IP:-127.0.0.1}:${HEALTH_PUBLISHED_PORT:-3000}:3000"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  test:
    profiles: [test]
    build:
      context: .
      target: test
    command: [npm, test]
    network_mode: none
